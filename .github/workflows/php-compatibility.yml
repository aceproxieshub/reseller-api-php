name: PHP Compatibility

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: php-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: PHP ${{ matrix.php-version }} (${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: '8.3'
            dependencies: lowest
            composer-args: '--prefer-lowest'
          - php-version: '8.3'
            dependencies: highest
            composer-args: ''
          - php-version: '8.4'
            dependencies: highest
            composer-args: ''
          - php-version: '8.5'
            dependencies: highest
            composer-args: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, dom, mbstring, xml
          coverage: none
          cache: composer
          tools: composer:v2

      - name: Resolve compatible dependencies
        run: composer update --prefer-dist --no-progress --no-interaction ${{ matrix.composer-args }}

      - name: Check platform requirements
        run: composer check-platform-reqs

      - name: Run PHPUnit
        run: vendor/bin/phpunit

      - name: Generate optimized production autoloader
        run: composer dump-autoload --no-dev --classmap-authoritative

      - name: Lint production source
        run: find src -type f -name '*.php' -print0 | xargs -0 -n1 php -l
